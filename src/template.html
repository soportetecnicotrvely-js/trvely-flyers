<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Generador de flyers Trvely</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Anton&family=Bebas+Neue&family=Oswald:wght@600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root{--b:#B41241;--be:#F4E5D2;--bg:#FAF7F2;--t:#1C1B1A;--l:#E9DFD4;--c:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1a19;--t:#f3ece4;--l:#3a3532;--c:#262321}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--b);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px}
header img{height:30px}header h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.3px}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;padding:20px;max-width:1200px;margin:0 auto}
.panel{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:5px}
input,select{min-width:0;width:100%;font:inherit;font-size:14px;padding:9px 10px;border:1.5px solid var(--l);border-radius:10px;background:var(--bg);color:var(--t)}
.row>label{min-width:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{flex-direction:row;align-items:center;gap:5px;font-weight:600;border:1.5px solid var(--l);border-radius:20px;padding:5px 10px;cursor:pointer}
.chips input{width:auto;padding:0;accent-color:var(--b)}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--l);cursor:pointer}.sw button.on{outline:3px solid var(--b);outline-offset:1px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:210px;overflow:auto}
.photos img{width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}.photos img.on{border-color:var(--b)}
.btn{background:var(--b);color:#fff;border:0;border-radius:24px;padding:12px;font:inherit;font-weight:800;cursor:pointer}
.stage{display:flex;justify-content:center;align-items:flex-start}
canvas{max-width:100%;height:auto;max-height:86vh;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--b);margin:4px 0 -4px}
@media(max-width:820px){.app{grid-template-columns:1fr;padding:12px}.stage{order:-1}}
</style></head><body>
<header><img id="hl" alt="Trvely"><h1>Generador de flyers</h1></header>
<div class="app"><div class="panel">
<h2>Contenido</h2>
<div class="row"><label>Destino<select id="dest"></select></label><label>Hotel<select id="hotel"></select></label></div>
<div class="row"><label>Precio por persona (COP)<input id="precio" type="number" value="1439900"></label><label>Noches<select id="noches"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label></div>
<label>Frase<input id="frase" value="Atrévete a vivir"></label>
<label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="sph" checked style="width:auto;accent-color:var(--b)">Etiqueta “Solo por hoy”</label>
<label>Importar lista de hoteles (CSV: destino;hotel)<input type="file" id="imp" accept=".csv,.txt"></label><label>Subir logo del hotel elegido<input type="file" id="lup" accept="image/*"></label><small id="msg"></small>
<h2>Qué incluye</h2><div class="chips" id="inc"></div>
<h2>Foto</h2><div class="photos" id="ph"></div>
<label>Subir otra foto<input type="file" id="up" accept="image/*"></label>
<h2>Estilo</h2>
<label>Tipografía del título<select id="font"><option value="Montserrat" data-w="800">Montserrat ExtraBold (marca)</option><option value="Anton">Anton (flyers actuales)</option><option value="Bebas Neue">Bebas Neue</option><option value="Oswald" data-w="600">Oswald</option><option value="Dancing Script" data-w="700">Dancing Script</option></select></label>
<label>Color del título y precio<div class="sw" id="c1"></div></label>
<label>Color del encabezado<div class="sw" id="c2"></div></label>
<button class="btn" id="dl">Descargar PNG</button>
</div><div class="stage"><canvas id="cv" width="900" height="1600"></canvas></div></div>
<script>
var A=__ASSETS__;
var PAL=[["#B41241","Burgundy"],["#F4E5D2","Beige"],["#FFFFFF","Blanco"],["#0F5C4F","Verde flyers"],["#7C0C2C","Burgundy hondo"]];
var INC=[["Vuelos","✈️"],["Traslados","🚗"],["Estadía","🛏️"],["Desayuno","🥐"],["Desayuno y cena","🍽️"],["Alimentación","🍹"],["Tour","🏖️"],["Asistencia médica","🩺"],["Snacks y bebidas","🥤"],["Seguro hotelero","🏨"]];
var $=function(i){return document.getElementById(i)},S={c1:"#B41241",c2:"#0F5C4F",photo:null},imgs={};
$("hl").src=A.lw;
var H=A.hotels.slice(),LG={};
function nz(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
try{JSON.parse(localStorage.getItem("tv_h")||"[]").forEach(function(h){var k=H.filter(function(x){return nz(x.n)==nz(h.n)&&x.d==h.d})[0];if(k){if(h.l)k.l=h.l}else H.push(h)})}catch(e){}
function save(){try{localStorage.setItem("tv_h",JSON.stringify(H))}catch(e){}}
function dlist(){var d=[];A.photos.concat(H).forEach(function(p){if(d.indexOf(p.d)<0)d.push(p.d)});return d.sort()}
function fillD(){var v=$("dest").value;$("dest").innerHTML=dlist().map(function(d){return"<option>"+d+"</option>"}).join("");$("dest").value=v||"San Andrés"}
function fillH(){var d=$("dest").value,hs=H.filter(function(h){return h.d==d});$("hotel").innerHTML=hs.length?hs.map(function(h,k){return"<option value='"+H.indexOf(h)+"'>"+h.n+"</option>"}).join(""):"<option value=''>(sin hoteles cargados)</option>";logo()}
function logo(){var h=H[+$("hotel").value];LG.img=null;if(h&&h.l)load(h.l).then(function(m){LG.img=m;draw()});else draw()}
function sw(id,key){var el=$(id);PAL.forEach(function(p){var b=document.createElement("button");b.style.background=p[0];b.title=p[1];b.onclick=function(){S[key]=p[0];[].forEach.call(el.children,function(x){x.classList.remove("on")});b.classList.add("on");draw()};if(p[0]==S[key])b.classList.add("on");el.appendChild(b)})}
sw("c1","c1");sw("c2","c2");
$("inc").innerHTML=INC.map(function(x,k){return'<label><input type="checkbox" value="'+k+'"'+([0,2,3,6,7].indexOf(k)>-1?" checked":"")+">"+x[0]+"</label>"}).join("");
function load(src){return new Promise(function(r){var m=new Image();m.onload=function(){r(m)};m.src=src})}
function renderPhotos(){var d=$("dest").value,h="";A.photos.forEach(function(p,k){if(p.d==d)h+='<img data-k="'+k+'" src="'+p.s+'">'});$("ph").innerHTML=h||"<small>Sin fotos para este destino: suba una.</small>";
 [].forEach.call($("ph").children,function(im){im.onclick=function(){setPhoto(A.photos[im.dataset.k].s,im)}});var f=$("ph").firstElementChild;if(f&&f.dataset)setPhoto(A.photos[f.dataset.k].s,f)}
function setPhoto(s,el){[].forEach.call($("ph").children,function(x){x.classList.remove("on")});if(el)el.classList.add("on");load(s).then(function(m){S.photo=m;draw()})}
$("imp").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var n=0,m=0;r.result.split(/\r?\n/).forEach(function(l,k){var p=l.split(/[;,\t]/).map(function(x){return x.trim().replace(/^"|"$/g,"")});if(p.length<2||!p[0]||!p[1]||(k==0&&/destino/i.test(p[0])))return;var ex=H.filter(function(x){return nz(x.n)==nz(p[1])})[0];if(ex&&ex.d==p[0])return;if(ex&&ex.l){H.push({n:p[1],d:p[0],l:ex.l});m++}else H.push({n:p[1],d:p[0]});n++});save();fillD();fillH();$("msg").textContent=n+" hoteles agregados ("+m+" con logo automático)."};r.readAsText(f)};
$("lup").onchange=function(e){var f=e.target.files[0],h=H[+$("hotel").value];if(!f||!h)return;var r=new FileReader();r.onload=function(){h.l=r.result;save();logo()};r.readAsDataURL(f)};
$("up").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){setPhoto(r.result,null)};r.readAsDataURL(f)};
function cover(c,m,x,y,w,h){var s=Math.max(w/m.width,h/m.height),dw=m.width*s,dh=m.height*s;c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.drawImage(m,x+(w-dw)/2,y+(h-dh)/2,dw,dh);c.restore()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function fit(c,t,max,size,fam,w){c.font=(w||"800")+" "+size+"px '"+fam+"'";while(c.measureText(t).width>max&&size>20){size-=4;c.font=(w||"800")+" "+size+"px '"+fam+"'"}return size}
function draw(){var c=$("cv").getContext("2d"),W=900,H=1600,o=$("font").selectedOptions[0],fam=o.value,fw=o.dataset.w||"400";
 c.clearRect(0,0,W,H);c.fillStyle="#cfe6f2";c.fillRect(0,0,W,H);if(S.photo)cover(c,S.photo,0,0,W,1260);
 c.fillStyle=S.c2;c.fillRect(0,0,W,100);[[330,95,115],[740,95,105],[40,90,60]].forEach(function(b){circ(c,b[0],b[1],b[2])});
 var L=imgs.lw;if(L)c.drawImage(L,40,26,150,48);
 var hh=H[+$("hotel").value];if(LG.img){var s=Math.min(280/LG.img.width,78/LG.img.height);c.drawImage(LG.img,860-LG.img.width*s,50-LG.img.height*s/2,LG.img.width*s,LG.img.height*s)}else if(hh){c.fillStyle="#fff";c.textAlign="right";c.font="700 34px Montserrat";c.fillText(hh.n,860,62)}
 c.fillStyle="#EFEDE8";c.fillRect(0,1240,W,360);[[110,1250,80],[430,1235,95],[760,1245,110]].forEach(function(b){circ(c,b[0],b[1],b[2])});
 if($("sph").checked){c.fillStyle="#fff";c.beginPath();c.roundRect?c.roundRect(125,1005,135,105,40):c.rect(125,1005,135,105);c.fill();c.fillStyle=S.c1;c.textAlign="center";c.font="800 34px 'Anton'";c.fillText("SOLO",192,1050);c.fillText("POR HOY",192,1092)}
 c.textAlign="center";c.fillStyle="rgba(255,255,255,.9)";c.font="500 36px Montserrat";c.fillText($("frase").value,450,1090);
 var t=$("dest").value.toUpperCase(),sz=fit(c,t,720,150,fam,fw);c.font=fw+" "+sz+"px '"+fam+"'";c.fillStyle=S.c1;c.shadowColor="rgba(0,0,0,.25)";c.shadowBlur=8;c.fillText(t,450,1235);c.shadowBlur=0;
 var n=+$("noches").value;c.fillStyle=S.c2;c.font="700 30px Montserrat";c.fillText((n+1)+" DÍAS "+n+" NOCHES",450,1288);
 var p=(+$("precio").value||0).toLocaleString("es-CO");c.fillStyle=S.c1==="#FFFFFF"||S.c1==="#F4E5D2"?S.c2:S.c1;c.font="800 44px Montserrat";c.fillText("$ "+p+" VALOR POR PERSONA",450,1340);
 var ch=[].filter.call($("inc").querySelectorAll("input"),function(x){return x.checked}),g=Math.min(110,560/Math.max(ch.length,1)),x0=450-g*(ch.length-1)/2;
 ch.forEach(function(x,k){var cx=x0+k*g;c.fillStyle="#F4E5D2";circ(c,cx,1405,32);c.font="30px Montserrat";c.fillStyle="#000";c.fillText(INC[x.value][1],cx,1416);c.fillStyle="#444";c.font="600 14px Montserrat";c.fillText(INC[x.value][0].length>12?INC[x.value][0].split(" ")[0]:INC[x.value][0],cx,1460)});
 c.fillStyle="#333";c.font="500 14px Montserrat";["Trvely SAS (RNT 232640) está registrado ante el Ministerio de Comercio, Industria y Turismo. Las tarifas y promociones están sujetos","a disponibilidad y cambios sin previo aviso. Los menores deben viajar con un padre o tutor legal, cumpliendo con los requisitos","legales. El manejo de datos personales cumple con la ley 1581 de 2012. LEY 679 2001, apoyamos la protección de la ESCNNA."].forEach(function(l,k){c.fillText(l,450,1520+k*19)})}
$("dest").onchange=function(){renderPhotos();fillH()};$("hotel").onchange=logo;["precio","noches","frase","sph","font"].forEach(function(i){$(i).oninput=$(i).onchange=draw});$("inc").onchange=draw;
$("dl").onclick=function(){var a=document.createElement("a");a.download="flyer-"+$("dest").value.toLowerCase().replace(/\s/g,"-")+".png";a.href=$("cv").toDataURL("image/png");a.click()};
Promise.all([load(A.lw)]).then(function(r){imgs.lw=r[0];return document.fonts.load("800 40px Montserrat")}).then(function(){return Promise.all(["40px Anton","40px 'Bebas Neue'","600 40px Oswald","700 40px 'Dancing Script'","700 30px Montserrat"].map(function(f){return document.fonts.load(f)}))}).then(function(){fillD();renderPhotos();fillH()});
document.fonts.ready.then(draw);
</script></body></html>
